<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/fcc-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Learn Gender</title>
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      // Mirrors resolveTheme() in src/lib/theme.ts; reads the same lng_settings.
      (function () {
        try {
          var pref = (JSON.parse(localStorage.getItem('lng_settings') || '{}').theme) || 'system';
          var dark = pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
